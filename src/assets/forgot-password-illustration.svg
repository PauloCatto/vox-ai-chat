<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8f9fa"/>
  <g transform="translate(100,100)">
    <rect x="0" y="0" width="600" height="400" rx="20" fill="#fff" stroke="#e0e0e0" stroke-width="2"/>
    <text x="300" y="40" text-anchor="middle" font-size="24" fill="#495057" font-family="Arial, sans-serif">Forgot Password</text>
    <rect x="60" y="80" width="480" height="50" rx="10" fill="#e3f2fd"/>
    <text x="80" y="110" font-size="16" fill="#0d6efd" font-family="Arial, sans-serif">Enter your email to reset your password</text>
    <rect x="60" y="160" width="480" height="50" rx="10" fill="#f1f3f5"/>
    <text x="80" y="190" font-size="16" fill="#495057" font-family="Arial, sans-serif">✉️ your.email@example.com</text>
    <circle cx="60" cy="320" r="25" fill="#0d6efd"/>
    <text x="55" y="327" font-size="18" fill="#fff" font-family="Arial, sans-serif">@</text>
    <rect x="100" y="305" width="400" height="30" rx="15" fill="#e9ecef"/>
    <text x="120" y="325" font-size="14" fill="#6c757d" font-family="Arial, sans-serif">Type your email...</text>
  </g>
</svg>
