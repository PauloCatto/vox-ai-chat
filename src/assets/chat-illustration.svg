<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8f9fa"/>
  <g transform="translate(100,100)">
    <rect x="0" y="0" width="600" height="400" rx="20" fill="#fff" stroke="#e0e0e0" stroke-width="2"/>
    <text x="300" y="40" text-anchor="middle" font-size="24" fill="#495057" font-family="Arial, sans-serif">Vox AI Chat</text>
    <rect x="60" y="80" width="360" height="50" rx="10" fill="#e3f2fd"/>
    <text x="80" y="110" font-size="16" fill="#0d6efd" font-family="Arial, sans-serif">👋 Hello! How can I assist you today?</text>
    <rect x="180" y="160" width="360" height="50" rx="10" fill="#f1f3f5"/>
    <text x="200" y="190" font-size="16" fill="#495057" font-family="Arial, sans-serif">Tell me about your latest project!</text>
    <rect x="60" y="240" width="360" height="50" rx="10" fill="#e3f2fd"/>
    <text x="80" y="270" font-size="16" fill="#0d6efd" font-family="Arial, sans-serif">Sure! It's an AI-powered chat assistant.</text>
    <circle cx="60" cy="400" r="25" fill="#0d6efd"/>
    <text x="55" y="407" font-size="18" fill="#fff" font-family="Arial, sans-serif">AI</text>
    <rect x="100" y="385" width="400" height="30" rx="15" fill="#e9ecef"/>
    <text x="120" y="405" font-size="14" fill="#6c757d" font-family="Arial, sans-serif">Type a message...</text>
  </g>
</svg>
