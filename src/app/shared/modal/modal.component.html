<div class="modal-header" [ngClass]="danger ? 'bg-danger text-white' : 'bg-primary text-white'">
  <h5 class="modal-title">
    <i class="bi me-2" [ngClass]="danger ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill'"></i>
    {{ title }}
  </h5>
  <button type="button" class="btn-close" [ngClass]="danger ? 'btn-close-white' : ''" aria-label="Close"
    (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <p class="mb-0" [innerHTML]="message"></p>
</div>
<div class="modal-footer" *ngIf="showActions">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss('cancel click')">
    {{ cancelText }}
  </button>
  <button type="button" class="btn" [ngClass]="danger ? 'btn-danger' : 'btn-primary'" (click)="activeModal.close('confirm click')"
    [disabled]="confirmLoading">
    <span *ngIf="confirmLoading" class="spinner-border spinner-border-sm me-1"></span>
    {{ confirmLoading ? 'Processing...' : confirmText }}
  </button>
</div>
