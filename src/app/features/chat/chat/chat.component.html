<div class="container-fluid d-flex flex-column vh-100 p-0">
  <div class="chat-header bg-primary text-white p-3 text-center">
    <h5 class="mb-0">VoxAI Chat</h5>
  </div>

  <!-- Área de mensagens -->
  <div class="chat-body flex-grow-1 overflow-auto p-3">
    <div class="chat-messages"></div>
  </div>

  <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="d-flex p-2 border-top bg-white">
    <input
      type="text"
      class="form-control me-2"
      placeholder="Type a message..."
      formControlName="message"
    />
    <button type="submit" class="btn btn-primary">Send</button>
  </form>
</div>
