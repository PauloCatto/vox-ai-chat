<div class="login-wrapper d-flex flex-column flex-md-row">
  <div class="sidebar-backdrop d-lg-none" *ngIf="false"></div>

  <div class="welcome-section">
    <h1 class="fw-bold mb-3">Welcome to Vox AI Chat</h1>
    <p class="lead mb-4">
      Talk smarter. Your personal assistant — now more human than ever.
    </p>
    <img
      src="assets/chat-illustration.svg"
      alt="Chat illustration"
      class="img-fluid"
    />
  </div>

  <div class="login-section">
    <div class="card shadow-sm p-4 border-0">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Login</h3>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter email"
              formControlName="email"
            />
            <div
              *ngIf="
                loginForm.get('email')?.touched &&
                loginForm.get('email')?.invalid
              "
              class="text-danger small mt-1"
            >
              Please enter a valid email.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                id="password"
                placeholder="Password"
                formControlName="password"
              />
              <span
                class="input-group-text"
                (click)="togglePasswordVisibility()"
                style="cursor: pointer"
              >
                <i
                  class="bi"
                  [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                ></i>
              </span>
            </div>
          </div>

          <div class="mb-3 text-end">
            <a routerLink="/forgot-password" class="small text-decoration-none"
              >Forgot password?</a
            >
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
            {{ errorMessage }}
          </div>

          <app-loading *ngIf="loading"></app-loading>

          <div class="d-grid mt-3">
            <button
              type="submit"
              class="btn btn-primary btn-lg"
              [disabled]="loading || loginForm.invalid"
            >
              {{ loading ? "Please wait..." : "Login" }}
            </button>
          </div>

          <div class="position-relative my-4">
            <hr />
            <span
              class="position-absolute top-50 start-50 translate-middle bg-light px-2 text-muted small"
              >OR</span
            >
          </div>

          <div class="d-grid">
            <button
              type="button"
              class="btn btn-outline-dark d-flex align-items-center justify-content-center"
              (click)="loginWithGoogle()"
              [disabled]="loading"
            >
              <i class="bi bi-google me-2"></i>
              Login with Google
            </button>
          </div>
        </form>

        <p class="text-center mt-4 mb-0">
          Don't have an account?
          <a routerLink="/signup" class="fw-bold text-decoration-none"
            >Sign up</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
