<div class="login-wrapper d-flex flex-column flex-md-row vh-100">
  <div
    class="welcome-section d-flex flex-column justify-content-center align-items-center text-center text-white p-4 flex-fill"
  >
    <h1 class="fw-bold mb-3">Forgot Password</h1>
    <p class="lead mb-4">
      Enter your email below to receive a password reset link.
    </p>
    <img
      src="assets/forgot-password-illustration.svg"
      alt="Forgot Password illustration"
      class="img-fluid"
    />
  </div>

  <div
    class="login-section d-flex justify-content-center align-items-center flex-fill bg-light"
  >
    <div
      class="card shadow-sm p-4 border-0"
      style="max-width: 400px; width: 100%"
    >
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Forgot Password</h3>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              formControlName="email"
            />
            <div
              *ngIf="
                forgotForm.get('email')?.touched &&
                forgotForm.get('email')?.invalid
              "
              class="text-danger small mt-1"
            >
              Please enter a valid email.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
            {{ errorMessage }}
          </div>
          <div
            *ngIf="successMessage"
            class="alert alert-success text-center py-2"
          >
            {{ successMessage }}
          </div>
          <div *ngIf="loading" class="text-center mt-2 text-muted small">
            Sending link...
          </div>

          <div class="d-grid mt-3">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="loading || forgotForm.invalid"
            >
              {{ loading ? "Please wait..." : "Send Reset Link" }}
            </button>
          </div>
        </form>

        <p class="text-center mt-3">
          Remembered your password? <a routerLink="/login">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
