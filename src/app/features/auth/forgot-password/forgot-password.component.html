<div class="login-wrapper">
  <div class="welcome-section d-none d-md-flex">
    <div class="content-fade-in">
      <h1 class="fw-bold mb-3">Forgot Password</h1>
      <p class="lead mb-4">
        Enter your email below to receive a password reset link.
      </p>
      <img
        src="assets/forgot-password-illustration.svg"
        alt="Forgot Password illustration"
        class="img-fluid floating-anim"
      />
    </div>
  </div>

  <div class="login-section">
    <img
      src="assets/forgot-password-illustration.svg"
      alt="Background Decor"
      class="bg-decor d-md-none floating-anim"
    />

    <div class="card shadow-lg p-4 border-0 glass-card">
      <div class="card-body">
        <h3 class="card-title text-center mb-4 fw-bold">Forgot Password</h3>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control custom-input"
              id="email"
              placeholder="Enter your email"
              formControlName="email"
            />
            <div
              *ngIf="
                forgotForm.get('email')?.touched &&
                forgotForm.get('email')?.invalid
              "
              class="text-danger small mt-1"
            >
              Please enter a valid email.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
            {{ errorMessage }}
          </div>

          <div
            *ngIf="successMessage"
            class="alert alert-success text-center py-2"
          >
            {{ successMessage }}
          </div>

          <app-loading
            *ngIf="loading"
            text="Sending reset link..."
          ></app-loading>

          <div class="d-grid mt-4">
            <button
              type="submit"
              class="btn btn-primary btn-lg shadow-sm"
              [disabled]="loading || forgotForm.invalid"
            >
              {{ loading ? "Please wait..." : "Send Reset Link" }}
            </button>
          </div>
        </form>

        <p class="text-center mt-4 mb-0">
          Remembered your password?
          <a routerLink="/login" class="fw-bold text-decoration-none">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
