<div class="signup-wrapper d-flex flex-column flex-md-row vh-100">
  <div
    class="welcome-section d-flex flex-column justify-content-center align-items-center text-center text-white p-4 flex-fill"
  >
    <h1 class="fw-bold mb-3">Create Your Account</h1>
    <p class="lead mb-4">
      Sign up and experience smarter conversations with Vox AI.
    </p>
    <img
      src="assets/chat-illustration.svg"
      alt="Chat illustration"
      class="img-fluid"
    />
  </div>

  <div
    class="signup-section d-flex justify-content-center align-items-center flex-fill bg-light position-relative"
  >
    <app-loading *ngIf="loading"></app-loading>

    <div
      class="card shadow-sm p-4 border-0"
      style="max-width: 400px; width: 100%"
      [class.opacity-50]="loading"
    >
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Sign Up</h3>

        <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
          {{ errorMessage }}
        </div>

        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Enter your full name"
              formControlName="name"
            />
            <div
              *ngIf="
                signupForm.get('name')?.touched &&
                signupForm.get('name')?.invalid
              "
              class="text-danger small mt-1"
            >
              Name is required.
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter email"
              formControlName="email"
            />
            <div
              *ngIf="
                signupForm.get('email')?.touched &&
                signupForm.get('email')?.invalid
              "
              class="text-danger small mt-1"
            >
              Please enter a valid email.
            </div>
          </div>

          <div class="mb-3 position-relative">
            <label for="password" class="form-label">Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              id="password"
              placeholder="Password"
              formControlName="password"
            />
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              (click)="togglePasswordVisibility()"
              style="
                position: absolute;
                right: 10px;
                top: 38px;
                cursor: pointer;
                color: #6c757d;
              "
            ></i>
            <div
              *ngIf="
                signupForm.get('password')?.touched &&
                signupForm.get('password')?.invalid
              "
              class="text-danger small mt-1"
            >
              Password is required.
            </div>
          </div>

          <div class="mb-3 position-relative">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              id="confirmPassword"
              placeholder="Confirm password"
              formControlName="confirmPassword"
            />
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              (click)="togglePasswordVisibility()"
              style="
                position: absolute;
                right: 10px;
                top: 38px;
                cursor: pointer;
                color: #6c757d;
              "
            ></i>
            <div
              *ngIf="
                signupForm.hasError('mismatch') &&
                signupForm.get('confirmPassword')?.touched
              "
              class="text-danger small mt-1"
            >
              Passwords do not match.
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary" [disabled]="loading">
              Sign Up
            </button>
          </div>
        </form>

        <p class="text-center mt-3">
          Already have an account? <a routerLink="/login">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
