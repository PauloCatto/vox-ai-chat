<div class="login-wrapper">
  <div class="welcome-section d-none d-md-flex">
    <div class="content-fade-in">
      <h1 class="fw-bold mb-3">Reset Your Password</h1>
      <p class="lead mb-4">
        Enter your new password below to update your account.
      </p>
      <img
        src="assets/reset-password-illustration.svg"
        alt="Reset Password illustration"
        class="img-fluid floating-anim"
      />
    </div>
  </div>

  <div class="login-section">
    <img
      src="assets/reset-password-illustration.svg"
      alt="Background Decor"
      class="bg-decor d-md-none floating-anim"
    />

    <app-loading *ngIf="loading"></app-loading>

    <div
      class="card shadow-lg p-4 border-0 glass-card"
      [class.opacity-50]="loading"
    >
      <div class="card-body">
        <h3 class="card-title text-center mb-4 fw-bold">New Password</h3>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">New Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control custom-input pe-5"
              id="password"
              formControlName="password"
              placeholder="Enter new password"
            />
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              (click)="togglePasswordVisibility()"
              style="
                position: absolute;
                right: 15px;
                top: 38px;
                cursor: pointer;
                color: #6c757d;
              "
            ></i>
            <div
              *ngIf="
                resetForm.get('password')?.touched &&
                resetForm.get('password')?.invalid
              "
              class="text-danger small mt-1"
            >
              Password is required.
            </div>
          </div>

          <div class="mb-3 position-relative">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control custom-input pe-5"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirm password"
            />
            <div
              *ngIf="
                resetForm.hasError('mismatch') &&
                resetForm.get('confirmPassword')?.touched
              "
              class="text-danger small mt-1"
            >
              Passwords do not match.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
            {{ errorMessage }}
          </div>

          <div
            *ngIf="successMessage"
            class="alert alert-success text-center py-2"
          >
            {{ successMessage }}
          </div>

          <div class="d-grid mt-4">
            <button
              type="submit"
              class="btn btn-primary btn-lg shadow-sm"
              [disabled]="loading || resetForm.invalid"
            >
              {{ loading ? "Updating..." : "Update Password" }}
            </button>
          </div>
        </form>

        <p class="text-center mt-4 mb-0">
          Remembered your password?
          <a routerLink="/login" class="fw-bold text-decoration-none">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
