<div class="login-wrapper d-flex flex-column flex-md-row vh-100">
  <div
    class="welcome-section d-flex flex-column justify-content-center align-items-center text-center text-white p-4 flex-fill"
  >
    <h1 class="fw-bold mb-3">Reset Your Password</h1>
    <p class="lead mb-4">
      Enter your new password below to update your account.
    </p>
    <img
      src="assets/reset-password-illustration.svg"
      alt="Reset Password illustration"
      class="img-fluid"
    />
  </div>

  <div
    class="login-section d-flex justify-content-center align-items-center flex-fill bg-light position-relative"
  >
    <app-loading *ngIf="loading"></app-loading>

    <div
      class="card shadow-sm p-4 border-0"
      style="max-width: 400px; width: 100%"
    >
      <div class="card-body">
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">New Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              id="password"
              formControlName="password"
              placeholder="Enter new password"
            />
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              (click)="togglePasswordVisibility()"
              style="
                position: absolute;
                right: 10px;
                top: 38px;
                cursor: pointer;
                color: #6c757d;
              "
            ></i>
            <div
              *ngIf="
                resetForm.get('password')?.touched &&
                resetForm.get('password')?.invalid
              "
              class="text-danger small mt-1"
            >
              Password is required.
            </div>
          </div>

          <div class="mb-3 position-relative">
            <label for="confirmPassword" class="form-label">
              Confirm Password
            </label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirm password"
            />
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              (click)="togglePasswordVisibility()"
              style="
                position: absolute;
                right: 10px;
                top: 38px;
                cursor: pointer;
                color: #6c757d;
              "
            ></i>
            <div
              *ngIf="
                resetForm.hasError('mismatch') &&
                resetForm.get('confirmPassword')?.touched
              "
              class="text-danger small mt-1"
            >
              Passwords do not match.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
            {{ errorMessage }}
          </div>

          <div
            *ngIf="successMessage"
            class="alert alert-success text-center py-2"
          >
            {{ successMessage }}
          </div>

          <div class="d-grid mt-3">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="loading || resetForm.invalid"
            >
              {{ loading ? "Updating..." : "Update Password" }}
            </button>
          </div>
        </form>

        <p class="text-center mt-3">
          Remembered your password?
          <a routerLink="/login">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
